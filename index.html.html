<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C9B8FF"><title>TaskFlow</title>
<style>

function saveBlock(id){const t=$('bt').value.trim(),k=$('bk').value,s=abs($('bd').value,$('bs').value),e=abs($('ed').value,$('be').value),c=ov(s,e,id),er=m=>{$('er').textContent=m;$('er').style.display='block'},kt=$('kt').checked,note=$('nt').value.trim();
 if(!t)return er('Enter a title.');if(!(e>s))return er('The end must be after the start.');if(e-s>2880)return er('A block can be at most 48 hours.');if(c)return er('Overlaps "'+c.title+'" ('+lbl(c.s,c.e)+'). Change the times first.');
 if($('sp').checked)PR.push({id:uid(),title:t,category:k,dur:e-s});const b=id&&B.find(x=>x.id===id);if(b)Object.assign(b,{title:t,category:k,s,e,auto:false,task:kt,note,done:kt?!!b.done:false});else B.push({id:uid(),title:t,category:k,s,e,task:kt,note,done:false});closeM();save();render()}
function dup(id){const b=B.find(x=>x.id===id),len=b.e-b.s,s=slot(len,b.e);B.push({...b,id:uid(),s,e:s+len,auto:false,done:false});closeM();save();render();toast('Copied to '+fa(s).t+' on '+fa(s).d)}
function delBlock(id){if(id.startsWith('sleep-'))S.sleepSkip.push(id.slice(6));B=B.filter(b=>b.id!==id);closeM();save();render()}
function taskForm(a,iid){const it=iid&&IN.find(x=>x.id===iid),f=a!=null?fa(a):{d:cur,t:''};modal(`<h2 class="d">${it?'Edit task':'New task'}</h2><label>Title<input id="tt" value="${it?esc(it.title):''}"></label><label>Total time (minutes)<input type="number" id="dm" min="15" step="5" value="${it?it.dur:30}"></label><div class="pl">${[15,30,45,60,90,120].map(m=>`<button class="btn sm" onclick="$('dm').value=${m}">${du(m)}</button>`).join('')}</div><div class="row"><label class="f">Date<input type="date" id="td" value="${f.d}"></label><label class="f">Start (empty = inbox)<input type="time" id="ti" value="${f.t}"></label></div><p class="err" id="er" role="alert"></p><div class="acts">${it?`<button class="btn" aria-label="Delete" onclick="IN=IN.filter(x=>x.id!=='${iid}');closeM();save();render()">${I('trash')}</button>`:''}<button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveTask('${iid||''}')">Save</button></div>`)}
function saveTask(iid){const t=$('tt').value.trim(),d=Math.max(15,+$('dm').value||30),ti=$('ti').value,er=m=>{$('er').textContent=m;$('er').style.display='block'};if(!t)return er('Enter a title.');
 if(ti){const a=abs($('td').value,ti),c=ov(a,a+d);if(c)return er('Overlaps "'+c.title+'". Pick another time, or clear the start to send it to the inbox.');B.push({id:uid(),title:t,category:'Personal',s:a,e:a+d,task:true,done:false});IN=IN.filter(x=>x.id!==iid)}
 else if(iid){const it=IN.find(x=>x.id===iid);it.title=t;it.dur=d}else IN.push({id:uid(),title:t,dur:d});closeM();save();render()}
const slot=(len,from)=>{let a=Math.ceil(from/15)*15;for(const b of [...B].sort((x,y)=>x.s-y.s)){if(b.e<=a)continue;if(b.s>=a+len)break;a=b.e}return a},base=()=>cur===todayKey()?nowAbs():dayIdx(cur)*1440+480;
function fitIn(id,q){const it=IN.find(x=>x.id===id);if(!it)return;const a=slot(it.dur,base());B.push({id:uid(),title:it.title,category:'Personal',s:a,e:a+it.dur,task:true,done:false});IN=IN.filter(x=>x.id!==id);if(!q){toast('Placed at '+fa(a).t+' on '+fa(a).d);save();render()}}
function fitAll(){[...IN].forEach(i=>fitIn(i.id,1));save();render();toast('Inbox placed into your free time')}
function rollover(){const t0=dayIdx(cur)*1440;B.filter(b=>b.task&&!b.done&&b.s>=t0&&b.s<t0+1440).forEach(b=>{const len=b.e-b.s;B=B.filter(x=>x!==b);b.s=slot(len,t0+1920);b.e=b.s+len;B.push(b)});save();render();toast('Unfinished tasks moved to tomorrow')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,B,IN,HB,PR,S})],{type:'application/json'}));a.download='taskflow-backup-'+todayKey()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.B))throw 0;B=o.B.filter(b=>b&&Number.isFinite(b.s)&&Number.isFinite(b.e)&&b.e>b.s);IN=o.IN||[];HB=o.HB||[];PR=o.PR||PR;S=Object.assign(S,o.S||{});save();closeM();render();toast('Backup restored (Undo is available)')}catch(e){toast('That file is not a valid backup')}};r.readAsText(f)}
function rTasks(){const t0=dayIdx(cur)*1440,l=B.filter(b=>b.task&&b.e>t0&&b.s<t0+1440).sort((a,b)=>a.s-b.s);
 return `<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="taskForm()">${I('plus')}Task</button><button class="btn" onclick="rollover()">Move unfinished to tomorrow</button></div>`+(l.map(b=>`<div class="item card"><button class="ck ${b.done?'on':''}" aria-label="Toggle done" onclick="tb('${b.id}')">${b.done?I('tasks'):''}</button><div class="f" style="${b.done?'text-decoration:line-through;opacity:.6':''}" onclick="blockForm('${b.id}')">${esc(b.title)}<small>${lbl(b.s,b.e)} · ${du(b.e-b.s)}</small></div></div>`).join('')||'<p style="margin-bottom:12px">No scheduled tasks today.</p>')+`<div class="row" style="margin:6px 0"><b class="f d">Inbox (${IN.length})</b>${IN.length?'<button class="btn sm" onclick="fitAll()">Fit all into free time</button>':''}</div>`+(IN.map(i=>`<div class="item card"><div class="f" onclick="taskForm(null,'${i.id}')">${esc(i.title)}<small>${du(i.dur)} · tap to edit</small></div><button class="btn sm" onclick="fitIn('${i.id}')">Fit</button></div>`).join('')||'<p>Inbox is empty. A task with no start time waits here until you place it.</p>')}
function habitForm(){modal(`<h2 class="d">New habit</h2><label>Name<input id="hn"></label><div class="row"><label class="f">Daily target<input type="number" id="ht" value="1" min="1"></label><label class="f">Unit<input id="hu" value="times"></label></div><div class="acts"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="saveHabit()">Save</button></div>`)}
function saveHabit(){const n=$('hn').value.trim();if(!n)return;HB.push({id:uid(),name:n,target:Math.max(1,+$('ht').value||1),unit:$('hu').value.trim(),history:{}});closeM();save();render()}
const hb=(id,d)=>{const h=HB.find(x=>x.id===id);h.history[cur]=Math.max(0,(h.history[cur]||0)+d);if(d>0&&h.history[cur]===h.target)chime();save();render()};
function rHabits(){return `<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="habitForm()">${I('plus')}Habit</button></div>`+(HB.map(h=>{const c=h.history[cur]||0;return `<div class="item card"><div class="f">${esc(h.name)}<small>${c}/${h.target} ${esc(h.unit)} · streak ${calcStreak(h)} days</small><div class="bar"><i style="width:${Math.min(100,c/h.target*100)}%"></i></div></div><button class="btn sm" aria-label="Less" onclick="hb('${h.id}',-1)">${I('minus')}</button><button class="btn sm" aria-label="More" onclick="hb('${h.id}',1)">${I('plus')}</button><button class="btn sm" aria-label="Delete habit" onclick="HB=HB.filter(x=>x.id!=='${h.id}');save();render()">${I('trash')}</button></div>`}).join('')||'<p>No habits yet. Add one to start a streak.</p>')}
function rCal(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h=`<div class="row"><button class="btn" aria-label="Previous month" onclick="cm=new Date(${y},${m-1},1);render()">${I('left')}</button><b class="f d" style="text-align:center">${cm.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="btn" aria-label="Next month" onclick="cm=new Date(${y},${m+1},1);render()">${I('right')}</button></div><div class="cal">${'SMTWTFS'.split('').map(x=>`<small>${x}</small>`).join('')}`+'<span></span>'.repeat(f);
 for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),a=dayIdx(k)*1440,dot=B.some(b=>!b.auto&&b.e>a&&b.s<a+1440);h+=`<button class="${k===cur?'sel':k===todayKey()?'tdy':''}" onclick="cur='${k}';tab='timeline';sf=null;render()">${d}${dot?'<u></u>':''}</button>`}return h+'</div>'}
function settings(){const ns='Notification' in window?Notification.permission:'unsupported';modal(`<h2 class="d">Settings</h2><div class="row"><label class="f">Sleep from<input type="time" id="ss" value="${S.sleepStart}"></label><label class="f">Sleep until<input type="time" id="se" value="${S.sleepEnd}"></label></div><label>Remind me before a task or block<select id="sl">${[5,10,15,30].map(x=>`<option value="${x}" ${x===+S.lead?'selected':''}>${x} minutes</option>`).join('')}</select></label><label><input type="checkbox" id="sm" ${S.muteNotifications?'checked':''}>Mute all reminders</label><label><input type="checkbox" id="sc" ${S.soundChime?'checked':''}>Play a chime</label><p style="margin:6px 0">System notifications: <b>${ns}</b> (they work while this page is open)</p>${ns==='default'?`<button class="btn" onclick="Notification.requestPermission().then(settings)">${I('bell')}Enable system notifications</button>`:''}<div class="row" style="margin:10px 0"><button class="btn" onclick="exp()">Export backup</button><label class="btn" style="margin:0;cursor:pointer">Import backup<input type="file" accept="application/json" hidden onchange="imp(this.files[0])"></label></div><h2 class="d" style="margin-top:14px">Presets</h2><div class="pl">${PR.map(p=>`<span class="btn sm" style="background:${CATS[p.category]}">${esc(p.title)} ${du(p.dur)}<button class="btn sm" style="padding:0 2px;box-shadow:none;border:0;background:none" aria-label="Delete preset" onclick="PR=PR.filter(x=>x.id!=='${p.id}');save();settings()">${I('x')}</button></span>`).join('')}</div><button class="btn sm" onclick="presetForm()">${I('plus')}New preset</button><div class="acts"><button class="btn pri" onclick="saveSettings()">Save</button></div>`)}
function saveSettings(){S.sleepStart=$('ss').value;S.sleepEnd=$('se').value;S.lead=+$('sl').value;S.muteNotifications=$('sm').checked;S.soundChime=$('sc').checked;B=B.filter(b=>!b.auto);closeM();save();render()}
function presetForm(){modal(`<h2 class="d">New preset</h2><label>Title<input id="pt"></label><div class="row"><label class="f">Category<select id="pk">${opts(Object.keys(CATS),'Work')}</select></label><label class="f">Minutes<input type="number" id="pd" value="60" min="15" step="15"></label></div><div class="acts"><button class="btn" onclick="settings()">Back</button><button class="btn pri" onclick="savePreset()">Save</button></div>`)}
function savePreset(){const t=$('pt').value.trim();if(t)PR.push({id:uid(),title:t,category:$('pk').value,dur:Math.max(15,+$('pd').value||60)});save();settings()}
function drag(e,id,mode){const b=B.find(x=>x.id===id),el=$('b-'+id);if(!b||!el)return;const ws=dayIdx(cur)*1440,we=ws+2880,o=B.filter(x=>x.id!==id),dur=b.e-b.s;
 const lo=Math.max(...o.filter(x=>x.e<=b.s).map(x=>x.e),Math.min(ws,b.s)),hi=Math.min(...o.filter(x=>x.s>=b.e).map(x=>x.s),Math.max(we,b.e));
 const touch=!!e.touches,y0=touch?e.touches[0].clientY:e.clientY;let armed=!(touch&&mode==='move'),ns=b.s,ne=b.e,tmr=null;window.dr=false;
 if(!armed)tmr=setTimeout(()=>{armed=true;window.dr=true;el.classList.add('dragging')},250);
 const stop=()=>{clearTimeout(tmr);['mousemove','touchmove'].forEach(t=>removeEventListener(t,mv));['mouseup','touchend','touchcancel'].forEach(t=>removeEventListener(t,end))};
 function mv(me){const dy=(me.touches?me.touches[0].clientY:me.clientY)-y0;if(!armed){if(Math.abs(dy)>8)stop();return}if(!window.dr){if(Math.abs(dy)<=5)return;window.dr=true;el.classList.add('dragging')}if(me.cancelable)me.preventDefault();
  const dm=Math.round(dy/H*4)*15;if(mode==='move'){ns=Math.min(Math.max(b.s+dm,lo),hi-dur);ne=ns+dur}else{ns=b.s;ne=Math.min(Math.max(b.e+dm,b.s+15),hi,b.s+2880)}
  el.style.top=(Math.max(ns,ws)-ws)/60*H+'px';el.style.height=Math.max(26,(Math.min(ne,we)-Math.max(ns,ws))/60*H)+'px';el.querySelector('span').textContent=lbl(ns,ne)}
 function end(){const m=window.dr;stop();if(m){b.s=ns;b.e=ne;b.auto=false;save();render();setTimeout(()=>window.dr=false,60)}}
 addEventListener('mousemove',mv);addEventListener('mouseup',end);addEventListener('touchmove',mv,{passive:false});addEventListener('touchend',end);addEventListener('touchcancel',end)}
migrate();U=[snap()];render();check();setInterval(check,15000);setInterval(()=>{if(tab==='timeline'&&!window.dr&&!$('m').classList.contains('on'))render()},60000);
</script></body></html>
